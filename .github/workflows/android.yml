# Builds the Android app (android/) on GitHub's servers whenever it changes, and puts the unsigned
# file on the "android-build" branch. It is then signed with the app's key (kept off GitHub) and
# copied to public/ajker-khobor-ki.apk. See CLAUDE.md, "Phone app".
name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        run: gradle -p android assembleRelease --no-daemon
      - name: Publish the unsigned file to the android-build branch
        run: |
          mkdir -p /tmp/apk && cp android/app/build/outputs/apk/release/*.apk /tmp/apk/app-release-unsigned.apk
          cd /tmp/apk
          git init -q -b android-build
          git config user.name "bp9889" && git config user.email "bp9889@users.noreply.github.com"
          git add . && git commit -q -m "Unsigned app build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-build
