# Builds the whole site as plain files every 20 minutes (fresh news, AI summaries) and publishes it on Cloudflare.
# Needs three repository secrets: GEMINI_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Build and publish

on:
  schedule:
    - cron: '*/20 * * * *'
  push:
    branches: [main, cf]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Saved article texts and AI summaries from earlier runs, so each story is only written once.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ github.run_id }}
          restore-keys: next-cache-

      - name: Build the site
        run: npx next build
        env:
          AKK_BUILD: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Publish on Cloudflare
        run: |
          printf '{"GEMINI_API_KEY":"%s"}' "$GEMINI_API_KEY" > /tmp/secrets.json
          npx wrangler deploy --secrets-file /tmp/secrets.json
          rm -f /tmp/secrets.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
